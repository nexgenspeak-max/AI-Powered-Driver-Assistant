name: CzenDriver
options:
  bundleIdPrefix: com.chinhtruongba
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.19.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  CzenDriver:
    type: application
    platform: iOS
    sources:
      - path: CzenDriver
    dependencies:
      - package: LiveKit
      - package: MapLibre
    info:
      path: CzenDriver/Info.plist
      properties:
        CFBundleDisplayName: Czen
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio, location, fetch]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Czen Driver needs microphone access so you can talk to the AI assistant.
        NSSpeechRecognitionUsageDescription: Czen Driver listens on-device for the wake phrase "hey ai" in hands-free mode.
        NSContactsUsageDescription: Czen Driver needs contacts access so the AI assistant can call people from your phone by name.
        NSLocationWhenInUseUsageDescription: Czen Driver needs your location to track the trip while you're driving.
        NSLocationAlwaysAndWhenInUseUsageDescription: Czen Driver needs your location in the background so it can notify the customer when you're close to the pickup point.
        CFBundleURLTypes:
          - CFBundleURLName: com.chinhtruongba.driverapp
            CFBundleURLSchemes: [driver-app]
        CZTripServiceURL: $(TRIP_SERVICE_URL)
        CZAuthServiceURL: $(AUTH_SERVICE_URL)
        CZTripServiceWSURL: $(TRIP_SERVICE_WS_URL)
        CZGoongMapsKey: $(GOONG_MAPS_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinhtruongba.driverapp
        PRODUCT_NAME: CzenDriver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  CzenDriverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CzenDriverTests
    dependencies:
      - target: CzenDriver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chinhtruongba.driverapp.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CzenDriver.app/CzenDriver
        BUNDLE_LOADER: $(TEST_HOST)
  CzenDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CzenDriverUITests
    dependencies:
      - target: CzenDriver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chinhtruongba.driverapp.uitests
        TEST_TARGET_NAME: CzenDriver
schemes:
  CzenDriver:
    build:
      targets:
        CzenDriver: all
        CzenDriverTests: [test]
        CzenDriverUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CzenDriverTests
        - CzenDriverUITests
    archive:
      config: Release
