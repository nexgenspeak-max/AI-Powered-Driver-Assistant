<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>

  <!-- start -->
  <ellipse cx="450" cy="55" rx="110" ry="36" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="450" y="60" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Tài xế nói</text>

  <rect x="320" y="120" width="260" height="56" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="450.0" y="153.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">STT → chữ (chốt câu)</text>

  <!-- diamond -->
  <polygon points="450,220 560,290 450,360 340,290" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827">Khớp ý định</text>
  <text x="450" y="303" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827">quen thuộc?</text>

  <!-- three paths -->
  <rect x="40" y="430" width="240" height="90" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="160.0" y="469.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">① Đường tắt</text>
<text x="160.0" y="489.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">khớp ý định → công cụ</text>
  <rect x="330" y="430" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="450.0" y="469.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">② Đường đủ</text>
<text x="450.0" y="489.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">LLM + schema tool</text>
  <rect x="620" y="430" width="240" height="90" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="740.0" y="469.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">③ Trò chuyện nhẹ</text>
<text x="740.0" y="489.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Không nạp bảng tool</text>

  <rect x="185" y="600" width="280" height="64" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="325.0" y="626.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">HTTP → trip-service</text>
<text x="325.0" y="646.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">khi cần đọc/ghi chuyến</text>
  <rect x="560" y="600" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="700.0" y="626.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Prefetch ngữ cảnh</text>
<text x="700.0" y="646.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">đã có từ lúc vào phiên</text>

  <rect x="320" y="740" width="260" height="56" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="450.0" y="773.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">TTS → câu trả lời ngắn</text>

  <ellipse cx="450" cy="870" rx="120" ry="36" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="450" y="875" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Kết thúc lượt</text>

  <!-- arrows vertical -->
  <line x1="450" y1="91" x2="450" y2="120" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="176" x2="450" y2="220" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- decide to three -->
  <line x1="400" y1="330" x2="160" y2="430" stroke="#15803D" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="220" y="390" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#15803D">có</text>

  <line x1="450" y1="360" x2="450" y2="430" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="460.0" y="395.0" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">mơ hồ</text>

  <line x1="500" y1="330" x2="740" y2="430" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="390" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">xã giao</text>

  <!-- paths down -->
  <line x1="160" y1="520" x2="280" y2="600" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="520" x2="360" y2="600" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="520" x2="740" y2="700" stroke="#111827" stroke-width="1.6"/>
  <line x1="740" y1="700" x2="580" y2="740" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="700" y1="632" x2="465" y2="632" stroke="#111827" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="325" y1="664" x2="450" y2="740" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="796" x2="450" y2="834" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="40" y="980" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#6B7280">Ưu tiên đường tắt cho việc quen thuộc — giảm độ trễ cảm nhận khi đang lái</text>
</svg>
