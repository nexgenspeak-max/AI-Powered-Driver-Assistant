<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>

  <!-- lane backgrounds -->
  <rect x="20" y="50" width="200" height="500" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
  <rect x="240" y="50" width="220" height="500" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
  <rect x="480" y="50" width="280" height="500" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>
  <rect x="780" y="50" width="460" height="500" rx="16" fill="#F9FAFB" stroke="#E5E7EB"/>

  <text x="120" y="78" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">1. Ứng dụng</text>
  <text x="350" y="78" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">2. Realtime</text>
  <text x="620" y="78" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">3. Hội thoại AI</text>
  <text x="1010" y="78" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7280">4. Nghiệp vụ (nền tảng)</text>

  <rect x="40" y="220" width="160" height="80" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="120.0" y="254.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Ứng dụng tài xế</text>
<text x="120.0" y="274.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Expo / React Native</text>
  <rect x="260" y="220" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="350.0" y="254.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">LiveKit Cloud</text>
<text x="350.0" y="274.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">WebRTC + SIP</text>
  <rect x="510" y="150" width="220" height="78" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
<text x="620.0" y="183.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">voice-agent</text>
<text x="620.0" y="203.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Python · LiveKit Agents</text>
  <rect x="510" y="290" width="220" height="78" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
<text x="620.0" y="323.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">STT → tắt/LLM → TTS</text>
<text x="620.0" y="343.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Chuỗi xử lý trong agent</text>

  <rect x="820" y="110" width="190" height="70" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="915.0" y="139.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">auth-service</text>
<text x="915.0" y="159.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Đăng nhập · JWT</text>
  <rect x="820" y="210" width="190" height="70" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="915.0" y="239.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">trip-service</text>
<text x="915.0" y="259.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Chuyến · token · context</text>
  <rect x="1040" y="210" width="170" height="70" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="1125.0" y="239.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">call-center</text>
<text x="1125.0" y="259.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Quay số PSTN</text>
  <rect x="820" y="360" width="190" height="70" rx="10" fill="#F8FAFC" stroke="#111827" stroke-width="2"/>
<text x="915.0" y="389.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">call-logger</text>
<text x="915.0" y="409.0" text-anchor="middle" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#4B5563">Lưu vết cuộc gọi</text>

  <!-- straight arrows between lanes -->
  <line x1="200" y1="260" x2="260" y2="260" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="220" y="250" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">âm thanh</text>

  <line x1="440" y1="260" x2="510" y2="189" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="445" y="210" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">phòng</text>

  <line x1="620" y1="228" x2="620" y2="290" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="628" y="268" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">pipeline</text>

  <line x1="730" y1="245" x2="820" y2="245" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="735" y="235" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">HTTP</text>

  <line x1="1010" y1="245" x2="1040" y2="245" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1012" y="235" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">gọi</text>

  <!-- app → auth (top) -->
  <path d="M120 220 L120 145 L820 145" fill="none" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="138" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">đăng nhập</text>

  <!-- app → trip (bottom of app) -->
  <path d="M120 300 L120 430 L730 430 L730 245" fill="none" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="448" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">token thoại / chuyến</text>

  <!-- voice → logger -->
  <path d="M620 368 L620 395 L820 395" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="388" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">log</text>

  <!-- call-center SIP back to LiveKit -->
  <path d="M1125 280 L1125 500 L350 500 L350 300" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="518" font-family="Arial Unicode MS, Arial, sans-serif" font-size="11" fill="#4B5563">SIP (khi gọi điện thoại)</text>

  <text x="40" y="590" font-family="Arial Unicode MS, Arial, sans-serif" font-size="12" fill="#6B7280">voice-agent chỉ gọi HTTP tới trip-service — không mở database trực tiếp</text>
</svg>
