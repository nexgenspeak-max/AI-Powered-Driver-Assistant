AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Driver Assistant - identity-service (Dịch vụ Định danh) - Lambda + API Gateway + DynamoDB

# Naming: stack ${Environment}-${AppName}-identity-service; logical IDs Identity<Role>;
# physical ${Environment}-${AppName}-identity-service-<role>; tags app/env/service/layer/component.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, prod]
  AppName:
    Type: String
    Default: driver-assistant
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Signs login tokens; every other service verifies with the same value.
  JwtAccessExpiresIn:
    Type: String
    Default: "15m"
  JwtRefreshExpiresIn:
    Type: String
    Default: "30d"

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENV: !Ref Environment
        DYNAMODB_TABLE: !Ref IdentityAccountsTable
        DYNAMODB_SETTINGS_TABLE: !Ref IdentityDriverSettingsTable
        JWT_SECRET: !Ref JwtSecret
        JWT_ACCESS_EXPIRES_IN: !Ref JwtAccessExpiresIn
        JWT_REFRESH_EXPIRES_IN: !Ref JwtRefreshExpiresIn

Resources:
  IdentityRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-${AppName}-identity-service-api"
      StageName: !Ref Environment
      Tags: { app: !Ref AppName, env: !Ref Environment, service: identity-service, layer: api-gateway, component: rest-api }

  # Express (serverless-http) owns routing; API Gateway proxies every path.
  IdentityFunction:
    Type: AWS::Serverless::Function
    DependsOn: IdentityFunctionLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-${AppName}-identity-service-fn"
      CodeUri: ../../src/backend/identity-service/
      Handler: src/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdentityAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdentityDriverSettingsTable
      Events:
        Root:
          Type: Api
          Properties: { RestApiId: !Ref IdentityRestApi, Path: "/", Method: ANY }
        Proxy:
          Type: Api
          Properties: { RestApiId: !Ref IdentityRestApi, Path: "/{proxy+}", Method: ANY }
      Tags: { app: !Ref AppName, env: !Ref Environment, service: identity-service, layer: microservices, component: lambda }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: [src/index.ts]
        External: ["@aws-sdk/*"]

  IdentityFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-${AppName}-identity-service-fn"
      RetentionInDays: 30
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: identity-service }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: log-group }

  IdentityAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-${AppName}-identity-service-accounts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: phone, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
        - { AttributeName: role, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: phone-index
          KeySchema: [{ AttributeName: phone, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
        - IndexName: email-index
          KeySchema: [{ AttributeName: email, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
        - IndexName: role-index
          KeySchema: [{ AttributeName: role, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: identity-service }
        - { Key: layer, Value: data }
        - { Key: component, Value: dynamodb-accounts }

  IdentityDriverSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-${AppName}-identity-service-driver-settings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id_account, AttributeType: S }
      KeySchema:
        - { AttributeName: id_account, KeyType: HASH }
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: identity-service }
        - { Key: layer, Value: data }
        - { Key: component, Value: dynamodb-driver-settings }

Outputs:
  IdentityApiUrl:
    Description: Base URL of identity-service (IDENTITY_SERVICE_URL for other services)
    Value: !Sub "https://${IdentityRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  IdentityAccountsTableName:
    Value: !Ref IdentityAccountsTable
  IdentityDriverSettingsTableName:
    Value: !Ref IdentityDriverSettingsTable
