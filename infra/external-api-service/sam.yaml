AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Driver Assistant - external-api-service (Dịch vụ Chuyến đi và Điều phối) - Lambda + API Gateway (REST, WebSocket) + DynamoDB

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, prod]

  AppName:
    Type: String
    Default: driver-assistant

  LivekitUrl:
    Type: String
    Default: ""

  LivekitApiKey:
    Type: String
    NoEcho: true
    Default: ""

  LivekitApiSecret:
    Type: String
    NoEcho: true
    Default: ""

  SipTrunkId:
    Type: String
    Default: ""

  GoogleMapsApiKey:
    Type: String
    NoEcho: true
    Default: ""

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Must match the JwtSecret used by identity-service — tokens are verified with this value.

  IdentityServiceUrl:
    Type: String
    Description: Base URL of identity-service — driver profile/status lives in its accounts table.

  CallRecordsServiceUrl:
    Type: String
    Default: ""
    Description: Base URL of call-records-service (call summaries). Empty disables summaries.

  ExternalChannelServiceUrl:
    Type: String
    Default: ""
    Description: Base URL of external-channel-service (SMS). Empty disables SMS.

  RedisUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Shared cache (driver/customer context, proximity-call dedupe) — must be a
      real reachable Redis under Lambda, unlike the in-memory fallback used when
      this is unset (fine for `local.ts`, useless across separate Lambda
      instances since each invocation is its own process). E.g. a serverless
      provider like Upstash needs no VPC; ElastiCache would additionally require
      VPC config on this function, not set up here.

  MapsProvider:
    Type: String
    Default: google
    AllowedValues: [google, goong]

  MapsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Falls back to GoogleMapsApiKey below when unset (see external-api-service's
      config.ts) — set this instead when MapsProvider=goong.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENV: !Ref Environment
        DYNAMODB_TABLE: !Ref ExternalApiTripsTable
        LIVEKIT_URL: !Ref LivekitUrl
        LIVEKIT_API_KEY: !Ref LivekitApiKey
        LIVEKIT_API_SECRET: !Ref LivekitApiSecret
        SIP_TRUNK_ID: !Ref SipTrunkId
        GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey
        MAPS_PROVIDER: !Ref MapsProvider
        MAPS_API_KEY: !Ref MapsApiKey
        JWT_SECRET: !Ref JwtSecret
        IDENTITY_SERVICE_URL: !Ref IdentityServiceUrl
        CALL_RECORDS_SERVICE_URL: !Ref CallRecordsServiceUrl
        EXTERNAL_CHANNEL_SERVICE_URL: !Ref ExternalChannelServiceUrl
        REDIS_URL: !Ref RedisUrl
        CONNECTIONS_TABLE: !Ref ExternalApiWsConnectionsTable
        # WEBSOCKET_API_ENDPOINT deliberately NOT set here — it references
        # ExternalApiDispatchWebSocketApi (below), and the WebSocket connect/disconnect functions
        # (which also inherit Globals) are themselves wired INTO that API's
        # routes, which would create a circular resource dependency. Set
        # explicitly instead on just ExternalApiFunction, the only function
        # that actually calls postToConnection.

Resources:
  ExternalApiRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-${AppName}-external-api-service-api"
      StageName: !Ref Environment
      Tags: { app: !Ref AppName, env: !Ref Environment, service: external-api-service, layer: api-gateway, component: rest-api }

  ExternalApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ExternalApiFunctionLogGroup
    Properties:
      FunctionName: !Sub "${Environment}-${AppName}-external-api-service-fn"
      CodeUri: ../../src/backend/external-api-service/
      Handler: src/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExternalApiTripsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExternalApiWsConnectionsTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExternalApiDispatchWebSocketApi}/${Environment}/POST/@connections/*"
      Environment:
        Variables:
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ExternalApiDispatchWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Events:
        Root:
          Type: Api
          Properties: { RestApiId: !Ref ExternalApiRestApi, Path: "/", Method: ANY }
        Proxy:
          Type: Api
          Properties: { RestApiId: !Ref ExternalApiRestApi, Path: "/{proxy+}", Method: ANY }
      Tags: { app: !Ref AppName, env: !Ref Environment, service: external-api-service, layer: microservices, component: lambda }
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: [src/index.ts]
        External: ["@aws-sdk/*"]

  ExternalApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Environment}-${AppName}-external-api-service-fn"
      RetentionInDays: 30
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: external-api-service }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: log-group }

  ExternalApiTripsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${Environment}-${AppName}-external-api-service-trips"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: trip_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: driver_phone
          AttributeType: S
        - AttributeName: customer_phone
          AttributeType: S
        - AttributeName: id_account
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: trip_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-created_at-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: driver_phone-created_at-index
          KeySchema:
            - AttributeName: driver_phone
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: customer_phone-created_at-index
          KeySchema:
            - AttributeName: customer_phone
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: id_account-created_at-index
          KeySchema:
            - AttributeName: id_account
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: external-api-service }
        - { Key: layer, Value: data }
        - { Key: component, Value: dynamodb-trips }

  # ── Real-time WebSocket push (trip_offer / trip_confirmed / trip_rejected) ──
  # API Gateway WebSocket gives each connected app a connectionId. Lambda is
  # stateless, so $connect stores connectionId ↔ "<role>#<phone>" in this table
  # and services/notify/lambda.ts looks it up to push; $disconnect removes it.

  ExternalApiWsConnectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${Environment}-${AppName}-external-api-service-ws-connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: role_id
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Looked up by notify/lambda.ts as `${role}#${id}` (e.g. "driver#0912345678")
        # to find which connection(s) to push a trip_offer/trip_confirmed/
        # trip_rejected event to.
        - IndexName: role_id-index
          KeySchema:
            - AttributeName: role_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: external-api-service }
        - { Key: layer, Value: data }
        - { Key: component, Value: dynamodb-ws-connections }

  ExternalApiDispatchWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Environment}-${AppName}-external-api-service-ws"
      ProtocolType: WEBSOCKET
      # Unused in practice — this deployment only ever needs $connect/
      # $disconnect (client identifies itself via query string on connect,
      # see websocketConnect.ts; nothing sends messages after that), but
      # ApiGatewayV2 WebSocket APIs require a RouteSelectionExpression.
      RouteSelectionExpression: "$request.body.action"

  ExternalApiWsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-${AppName}-external-api-service-ws-connect-fn"
      CodeUri: ../../src/backend/external-api-service/
      Handler: src/handlers/websocketConnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExternalApiWsConnectionsTable

  ExternalApiWsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-${AppName}-external-api-service-ws-disconnect-fn"
      CodeUri: ../../src/backend/external-api-service/
      Handler: src/handlers/websocketDisconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExternalApiWsConnectionsTable

  ExternalApiWsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExternalApiWsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExternalApiDispatchWebSocketApi}/*"

  ExternalApiWsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExternalApiWsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExternalApiDispatchWebSocketApi}/*"

  ExternalApiWsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExternalApiWsConnectFunction.Arn}/invocations"

  ExternalApiWsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${ExternalApiWsConnectIntegration}"

  ExternalApiWsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExternalApiWsDisconnectFunction.Arn}/invocations"

  ExternalApiWsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${ExternalApiWsDisconnectIntegration}"

  ExternalApiDispatchWebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ExternalApiWsConnectRoute
      - ExternalApiWsDisconnectRoute
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi

  ExternalApiDispatchWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ExternalApiDispatchWebSocketApi
      DeploymentId: !Ref ExternalApiDispatchWebSocketDeployment
      StageName: !Ref Environment

Outputs:
  ExternalApiUrl:
    Description: Base URL of external-api-service (EXTERNAL_API_SERVICE_URL for llm-orchestrator and apps)
    Value: !Sub "https://${ExternalApiRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  ExternalApiTripsTableName:
    Value: !Ref ExternalApiTripsTable
  ExternalApiDispatchWebSocketUrl:
    Description: >
      wss:// URL driver-app/customer-app connect to for real-time trip_offer/
      trip_confirmed/trip_rejected push — append ?role=driver&id=<phone> (or
      role=customer). See notify/local.ts for the identical local-dev protocol.
    Value: !Sub "wss://${ExternalApiDispatchWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
