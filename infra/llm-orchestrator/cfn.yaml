AWSTemplateFormatVersion: '2010-09-09'
Description: Driver Assistant - llm-orchestrator (Tác nhân hội thoại giọng nói) on Amazon ECS Fargate

# Naming convention (see infra/README.md, "Naming convention"):
#   stack          ${Environment}-${AppName}-llm-orchestrator
#   logical ID     LlmOrchestrator<Role>
#   physical name  ${Environment}-${AppName}-llm-orchestrator[-<role>]
#   tags           app, env, service, layer, component

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, prod]

  AppName:
    Type: String
    Default: driver-assistant

  ImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789.dkr.ecr.ap-southeast-1.amazonaws.com/dev-driver-assistant-llm-orchestrator:latest)

  LivekitUrl:
    Type: String

  LivekitApiKey:
    Type: String
    NoEcho: true

  LivekitApiSecret:
    Type: String
    NoEcho: true

  OpenaiApiKey:
    Type: String
    NoEcho: true

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""

  ElevenLabsVoiceId:
    Type: String
    Default: ""

  ElevenLabsModel:
    Type: String
    Default: eleven_flash_v2_5

  DeepgramApiKey:
    Type: String
    NoEcho: true
    Default: ""

  GoogleCredentialsJson:
    Type: String
    NoEcho: true
    Default: ""

  SttProvider:
    Type: String
    Default: openai

  LlmProvider:
    Type: String
    Default: openai

  LlmModel:
    Type: String
    Default: gpt-4o-mini
    Description: Passed as LLM_MODEL (read by Settings.llm_model)

  TtsProvider:
    Type: String
    Default: elevenlabs

  TwilioPhoneNumber:
    Type: String
    Default: ""

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Must match identity-service / external-api-service; used to sign the service token for external-api-service calls.

  ExternalApiServiceUrl:
    Type: String
    Default: ""
    Description: external-api-service (Dịch vụ Chuyến đi và Điều phối) API Gateway base URL

  CallRecordsServiceUrl:
    Type: String
    Default: ""
    Description: call-records-service (Dịch vụ Lưu vết cuộc gọi) API Gateway base URL; empty disables call-record persistence

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ECS tasks

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ECS tasks (outbound-only worker, no load balancer)

  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of agent worker tasks (horizontal scaling)

Resources:

  # ── Container registry ──────────────────────────────────────
  LlmOrchestratorRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub "${Environment}-${AppName}-llm-orchestrator"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: container-registry }

  # ── IAM roles ───────────────────────────────────────────────
  LlmOrchestratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-llm-orchestrator-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: iam-execution-role }

  LlmOrchestratorTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-llm-orchestrator-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LlmOrchestratorLogGroup.Arn
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: iam-task-role }

  # ── Observability ───────────────────────────────────────────
  LlmOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${Environment}-${AppName}-llm-orchestrator"
      RetentionInDays: 14
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: cross-cutting }
        - { Key: component, Value: log-group }

  # ── Network ─────────────────────────────────────────────────
  # The agent worker only opens outbound connections (LiveKit Cloud,
  # external-api-service, STT/LLM/TTS providers); no inbound listener.
  LlmOrchestratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Environment}-${AppName}-llm-orchestrator-sg"
      GroupDescription: !Sub "${Environment}-${AppName}-llm-orchestrator outbound-only"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: realtime-ai }
        - { Key: component, Value: security-group }

  # ── Compute ─────────────────────────────────────────────────
  LlmOrchestratorCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Environment}-${AppName}-llm-orchestrator"
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: realtime-ai }
        - { Key: component, Value: ecs-cluster }

  LlmOrchestratorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Environment}-${AppName}-llm-orchestrator"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt LlmOrchestratorExecutionRole.Arn
      TaskRoleArn: !GetAtt LlmOrchestratorTaskRole.Arn
      ContainerDefinitions:
        - Name: llm-orchestrator
          Image: !Ref ImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LlmOrchestratorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: ENV
              Value: !Ref Environment
            - Name: LIVEKIT_URL
              Value: !Ref LivekitUrl
            - Name: LIVEKIT_API_KEY
              Value: !Ref LivekitApiKey
            - Name: LIVEKIT_API_SECRET
              Value: !Ref LivekitApiSecret
            - Name: OPENAI_API_KEY
              Value: !Ref OpenaiApiKey
            - Name: ELEVENLABS_API_KEY
              Value: !Ref ElevenLabsApiKey
            - Name: ELEVENLABS_VOICE_ID
              Value: !Ref ElevenLabsVoiceId
            - Name: ELEVENLABS_MODEL
              Value: !Ref ElevenLabsModel
            - Name: DEEPGRAM_API_KEY
              Value: !Ref DeepgramApiKey
            - Name: GOOGLE_CREDENTIALS_JSON
              Value: !Ref GoogleCredentialsJson
            - Name: STT_PROVIDER
              Value: !Ref SttProvider
            - Name: LLM_PROVIDER
              Value: !Ref LlmProvider
            - Name: LLM_MODEL
              Value: !Ref LlmModel
            - Name: TTS_PROVIDER
              Value: !Ref TtsProvider
            - Name: TWILIO_PHONE_NUMBER
              Value: !Ref TwilioPhoneNumber
            - Name: EXTERNAL_API_SERVICE_URL
              Value: !Ref ExternalApiServiceUrl
            - Name: CALL_RECORDS_SERVICE_URL
              Value: !Ref CallRecordsServiceUrl
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: realtime-ai }
        - { Key: component, Value: ecs-task-definition }

  LlmOrchestratorService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${Environment}-${AppName}-llm-orchestrator"
      Cluster: !Ref LlmOrchestratorCluster
      TaskDefinition: !Ref LlmOrchestratorTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref LlmOrchestratorSecurityGroup
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: env, Value: !Ref Environment }
        - { Key: service, Value: llm-orchestrator }
        - { Key: layer, Value: realtime-ai }
        - { Key: component, Value: ecs-service }

Outputs:
  LlmOrchestratorRepositoryUri:
    Description: ECR repository URI for the llm-orchestrator image
    Value: !GetAtt LlmOrchestratorRepository.RepositoryUri

  LlmOrchestratorClusterName:
    Value: !Ref LlmOrchestratorCluster

  LlmOrchestratorServiceName:
    Value: !GetAtt LlmOrchestratorService.Name

  LlmOrchestratorLogGroupName:
    Value: !Ref LlmOrchestratorLogGroup
