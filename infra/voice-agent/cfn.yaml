AWSTemplateFormatVersion: '2010-09-09'
Description: Driver Assistant - voice-agent service (ECS Fargate)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, uat, prod]

  AppName:
    Type: String
    Default: driver-assistant

  ImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789.dkr.ecr.ap-southeast-1.amazonaws.com/dev-driver-assistant-voice-agent:latest)

  LivekitUrl:
    Type: String

  LivekitApiKey:
    Type: String
    NoEcho: true

  LivekitApiSecret:
    Type: String
    NoEcho: true

  OpenaiApiKey:
    Type: String
    NoEcho: true

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""

  ElevenLabsVoiceId:
    Type: String
    Default: ""

  ElevenLabsModel:
    Type: String
    Default: eleven_flash_v2_5

  DeepgramApiKey:
    Type: String
    NoEcho: true
    Default: ""

  GoogleCredentialsJson:
    Type: String
    NoEcho: true
    Default: ""

  SttProvider:
    Type: String
    Default: openai

  LlmProvider:
    Type: String
    Default: openai

  TtsProvider:
    Type: String
    Default: elevenlabs

  OpenaiModel:
    Type: String
    Default: gpt-4o-mini

  TwilioPhoneNumber:
    Type: String
    Default: ""

  CallLoggerUrl:
    Type: String
    Default: ""
    Description: Call-logger API Gateway URL for saving call records

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Must match the JwtSecret used by auth-service/trip-service — voice-agent signs its own service token with this to call trip-service.

  TripServiceUrl:
    Type: String
    Default: ""
    Description: trip-service API Gateway URL

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy ECS service into

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for ECS tasks

  DesiredCount:
    Type: Number
    Default: 1

Resources:

  # ── ECR Repository ──────────────────────────────────────────
  ECRRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub "${Environment}-${AppName}-voice-agent"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

  # ── IAM Roles ────────────────────────────────────────────────
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-voice-agent-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Environment}-${AppName}-voice-agent-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  # ── CloudWatch Log Group ─────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${Environment}-${AppName}-voice-agent"
      RetentionInDays: 14

  # ── Security Groups ──────────────────────────────────────────
  # Public — fronts the ALB. trip-service is a non-VPC Lambda (see
  # infra/trip-service/sam.yaml), so it can only reach this over the
  # internet; the vision-scan endpoint is protected by the same
  # shared-JWT_SECRET service-token scheme trip-service uses to call
  # auth-service, not network isolation.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Environment}-${AppName}-voice-agent-alb"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Environment}-${AppName}-voice-agent"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ── ECS Cluster ──────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${Environment}-${AppName}-voice-agent"

  # ── Task Definition ──────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Environment}-${AppName}-voice-agent"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: voice-agent
          Image: !Ref ImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: ENV
              Value: !Ref Environment
            - Name: LIVEKIT_URL
              Value: !Ref LivekitUrl
            - Name: LIVEKIT_API_KEY
              Value: !Ref LivekitApiKey
            - Name: LIVEKIT_API_SECRET
              Value: !Ref LivekitApiSecret
            - Name: OPENAI_API_KEY
              Value: !Ref OpenaiApiKey
            - Name: OPENAI_MODEL
              Value: !Ref OpenaiModel
            - Name: ELEVENLABS_API_KEY
              Value: !Ref ElevenLabsApiKey
            - Name: ELEVENLABS_VOICE_ID
              Value: !Ref ElevenLabsVoiceId
            - Name: ELEVENLABS_MODEL
              Value: !Ref ElevenLabsModel
            - Name: DEEPGRAM_API_KEY
              Value: !Ref DeepgramApiKey
            - Name: GOOGLE_CREDENTIALS_JSON
              Value: !Ref GoogleCredentialsJson
            - Name: STT_PROVIDER
              Value: !Ref SttProvider
            - Name: LLM_PROVIDER
              Value: !Ref LlmProvider
            - Name: TTS_PROVIDER
              Value: !Ref TtsProvider
            - Name: TWILIO_PHONE_NUMBER
              Value: !Ref TwilioPhoneNumber
            - Name: CALL_LOGGER_URL
              Value: !Ref CallLoggerUrl
            - Name: TRIP_SERVICE_URL
              Value: !Ref TripServiceUrl
            - Name: JWT_SECRET
              Value: !Ref JwtSecret

  # Separate task definition + service from the LiveKit worker above (not a
  # sidecar in the same task) — on purpose: they'd otherwise share one Essential
  # container group, so a crash-loop or failed ALB health check on vision-api
  # would make ECS cycle the *whole task*, restarting the LiveKit worker
  # mid-call too. Same image (built once), just a different Command, so this
  # costs no extra build/push step.
  VisionApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${Environment}-${AppName}-vision-api"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: vision-api
          Image: !Ref ImageUri
          Essential: true
          Command:
            - uvicorn
            - app.vision_api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          PortMappings:
            - ContainerPort: 8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs-vision-api
          Environment:
            - Name: ENV
              Value: !Ref Environment
            - Name: OPENAI_API_KEY
              Value: !Ref OpenaiApiKey
            - Name: LLM_MODEL
              Value: !Ref OpenaiModel
            - Name: JWT_SECRET
              Value: !Ref JwtSecret

  # ── Load Balancer (public — see AlbSecurityGroup comment above) ─
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Environment}-${AppName}-voice-agent"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  VisionApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Environment}-${AppName}-vision-api"
      TargetType: ip
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref VisionApiTargetGroup

  # ── ECS Services ─────────────────────────────────────────────
  # Unchanged from before this vision-api addition — no load balancer, no
  # dependency on the ALB/Listener below, so it deploys/updates exactly as
  # it always has.
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${Environment}-${AppName}-voice-agent"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref SecurityGroup

  VisionApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${Environment}-${AppName}-vision-api"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref VisionApiTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers:
        - ContainerName: vision-api
          ContainerPort: 8080
          TargetGroupArn: !Ref VisionApiTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref SecurityGroup

Outputs:
  ECRRepositoryUri:
    Description: ECR repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

  ECSClusterName:
    Value: !Ref ECSCluster

  ECSServiceName:
    Value: !GetAtt ECSService.Name

  VisionApiServiceName:
    Value: !GetAtt VisionApiService.Name

  VoiceAgentApiUrl:
    Description: Public URL for the vision-api service — set as VOICE_AGENT_URL in trip-service
    Value: !Sub "http://${LoadBalancer.DNSName}"
